name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-rust-core:
    name: Rust Edge Vision Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Tests
        run: |
          cd pothole_core
          cargo test --verbose

  test-python-backend:
    name: FastAPI Telemetry Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          cd pothole-sync-backend
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          cd pothole-sync-backend
          pytest -v
